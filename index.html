<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>볼리베어 상대법 도감</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0b132b;
        color: #e0e6ed;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 20px;
      }
      header {
        max-width: 900px;
        margin: 0 auto 20px auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid #1c2541;
        padding-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        color: #48cae4;
      }
      .header-btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        background-color: #1c2541;
        color: #fff;
        border: 1px solid #3a506b;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
      }
      button:hover {
        background-color: #3a506b;
      }
      button.primary {
        background-color: #0077b6;
        border-color: #0096c7;
      }
      button.primary:hover {
        background-color: #0096c7;
      }

      /* 카드 그리드 */
      #card-container {
        max-width: 900px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .card {
        background-color: #1c2541;
        border: 1px solid #273456;
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
      }
      .card-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .champ-img {
        width: 52px;
        height: 52px;
        border-radius: 8px;
        border: 1px solid #3a506b;
      }
      .champ-name {
        font-size: 18px;
        font-weight: bold;
        color: #fff;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        margin-top: 4px;
        font-weight: bold;
      }
      .badge-쉬움 {
        background-color: #065f46;
        color: #34d399;
      }
      .badge-보통 {
        background-color: #854d0e;
        color: #facc15;
      }
      .badge-어려움 {
        background-color: #991b1b;
        color: #f87171;
      }
      .info-box {
        font-size: 13px;
        background-color: #0b132b;
        padding: 8px 10px;
        border-radius: 6px;
        line-height: 1.6;
      }
      .tip-box {
        font-size: 13px;
        color: #90e0ef;
        background-color: rgba(72, 202, 228, 0.1);
        border-left: 3px solid #48cae4;
        padding: 8px;
        border-radius: 0 4px 4px 0;
      }
      .card-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: auto;
      }
      .card-actions button {
        padding: 4px 8px;
        font-size: 12px;
      }
      .btn-del {
        color: #f87171;
      }

      /* 입력/수정 팝업창 (모달) */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 999;
      }
      .modal {
        background-color: #1c2541;
        border: 1px solid #3a506b;
        border-radius: 10px;
        max-width: 450px;
        width: 100%;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .modal h2 {
        font-size: 18px;
        color: #48cae4;
      }
      .modal label {
        font-size: 12px;
        color: #94a3b8;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .modal input,
      .modal select,
      .modal textarea {
        background-color: #0b132b;
        border: 1px solid #3a506b;
        color: #fff;
        padding: 8px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 13px;
      }
      .modal-btns {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>⚡ 볼리베어 매치업 도감</h1>
        <p style="font-size: 12px; color: #8d99ae; margin-top: 4px">
          어디서나 접근 가능한 나만의 공략 노트
        </p>
      </div>
      <div class="header-btns">
        <button class="primary" onclick="openAddModal()">+ 챔피언 추가</button>
        <button onclick="exportJSON()">💾 세이브 파일 내보내기</button>
        <button onclick="document.getElementById('importFile').click()">
          📂 세이브 파일 불러오기
        </button>
        <input
          type="file"
          id="importFile"
          style="display: none"
          accept=".json"
          onchange="importJSON(event)"
        />
      </div>
    </header>

    <main id="card-container"></main>

    <!-- 챔피언 추가/수정 팝업 -->
    <div class="modal-overlay" id="editModal">
      <div class="modal">
        <h2 id="modalTitle">챔피언 공략 편집</h2>
        <label>
          라이엇 영문 이름 (초상화용, 예: Aatrox, Fiora, Darius):
          <input type="text" id="inputChampId" placeholder="Aatrox" />
        </label>
        <label>
          한글 이름:
          <input type="text" id="inputChampName" placeholder="아트록스" />
        </label>
        <label>
          난이도:
          <select id="inputDifficulty">
            <option value="쉬움">쉬움</option>
            <option value="보통">보통</option>
            <option value="어려움">어려움</option>
          </select>
        </label>
        <label>
          추천 룬:
          <input type="text" id="inputRune" placeholder="착취의 손아귀" />
        </label>
        <label>
          추천 스펠:
          <input type="text" id="inputSpells" placeholder="점멸 + 텔포" />
        </label>
        <label>
          선마 순서:
          <input type="text" id="inputSkillOrder" placeholder="W -> Q -> E" />
        </label>
        <label>
          핵심 공략 팁:
          <textarea
            id="inputCoreTip"
            rows="3"
            placeholder="라인전 팁을 적어주세요."
          ></textarea>
        </label>
        <div class="modal-btns">
          <button onclick="closeModal()">취소</button>
          <button class="primary" onclick="saveChampion()">저장</button>
        </div>
      </div>
    </div>

    <script>
      // 기본 초기 데이터
      const defaultData = [
        {
          id: 'Aatrox',
          name: '아트록스',
          difficulty: '보통',
          rune: '착취의 손아귀',
          spells: '점멸 + 텔포',
          skillOrder: 'W -> Q -> E',
          coreTip: 'Q 1, 2타는 안쪽으로 파고들고, Q 3타는 내 Q나 R로 끊기',
        },
        {
          id: 'Fiora',
          name: '피오라',
          difficulty: '어려움',
          rune: '집중 공격',
          spells: '점멸 + 점화',
          skillOrder: 'W -> E -> Q',
          coreTip: 'Q 기절을 응수에 박지 말 것. 앞무빙으로 빼고 E 실드로 딜교',
        },
        {
          id: 'Darius',
          name: '다리우스',
          difficulty: '보통',
          rune: '착취 또는 치속',
          spells: '유체화 + 점멸',
          skillOrder: 'W -> Q -> E',
          coreTip: '다리우스 Q 돌릴 때 도끼자루 안으로 파고들어 W 긁기',
        },
      ];

      // 브라우저 저장소(localStorage)에서 데이터 읽어오기 (없으면 기본값 사용)
      let matchups =
        JSON.parse(localStorage.getItem('voli_matchups')) || defaultData;
      let editingIndex = -1; // -1이면 신규 추가, 0 이상이면 해당 번호 수정

      function renderCards() {
        const container = document.getElementById('card-container');
        container.innerHTML = '';

        matchups.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
          <div class="card-top">
            <img class="champ-img" src="https://ddragon.leagueoflegends.com/cdn/14.8.1/img/champion/${item.id}.png" alt="${item.name}" onerror="this.src='https://via.placeholder.com/52'">
            <div>
              <div class="champ-name">${item.name}</div>
              <span class="badge badge-${item.difficulty}">${item.difficulty}</span>
            </div>
          </div>
          <div class="info-box">
            <div><strong>룬:</strong> ${item.rune}</div>
            <div><strong>스펠:</strong> ${item.spells}</div>
            <div><strong>선마:</strong> ${item.skillOrder}</div>
          </div>
          <div class="tip-box">
            <strong>핵심:</strong> ${item.coreTip}
          </div>
          <div class="card-actions">
            <button onclick="openEditModal(${index})">수정</button>
            <button class="btn-del" onclick="deleteChampion(${index})">삭제</button>
          </div>
        `;
          container.appendChild(card);
        });

        // 브라우저에 자동 임시 저장
        localStorage.setItem('voli_matchups', JSON.stringify(matchups));
      }

      // 모달 제어
      function openAddModal() {
        editingIndex = -1;
        document.getElementById('modalTitle').innerText = '새 챔피언 공략 추가';
        document.getElementById('inputChampId').value = '';
        document.getElementById('inputChampName').value = '';
        document.getElementById('inputDifficulty').value = '보통';
        document.getElementById('inputRune').value = '';
        document.getElementById('inputSpells').value = '';
        document.getElementById('inputSkillOrder').value = 'W -> Q -> E';
        document.getElementById('inputCoreTip').value = '';
        document.getElementById('editModal').style.display = 'flex';
      }

      function openEditModal(index) {
        editingIndex = index;
        const item = matchups[index];
        document.getElementById('modalTitle').innerText =
          `${item.name} 공략 수정`;
        document.getElementById('inputChampId').value = item.id;
        document.getElementById('inputChampName').value = item.name;
        document.getElementById('inputDifficulty').value = item.difficulty;
        document.getElementById('inputRune').value = item.rune;
        document.getElementById('inputSpells').value = item.spells;
        document.getElementById('inputSkillOrder').value = item.skillOrder;
        document.getElementById('inputCoreTip').value = item.coreTip;
        document.getElementById('editModal').style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('editModal').style.display = 'none';
      }

      function saveChampion() {
        const champId = document.getElementById('inputChampId').value.trim();
        const champName = document
          .getElementById('inputChampName')
          .value.trim();

        if (!champId || !champName) {
          alert('영문 이름과 한글 이름을 입력해주세요!');
          return;
        }

        const newObj = {
          id: champId,
          name: champName,
          difficulty: document.getElementById('inputDifficulty').value,
          rune: document.getElementById('inputRune').value.trim() || '미지정',
          spells:
            document.getElementById('inputSpells').value.trim() || '미지정',
          skillOrder:
            document.getElementById('inputSkillOrder').value.trim() ||
            'W -> Q -> E',
          coreTip:
            document.getElementById('inputCoreTip').value.trim() ||
            '팁 내용 없음',
        };

        if (editingIndex === -1) {
          matchups.push(newObj);
        } else {
          matchups[editingIndex] = newObj;
        }

        closeModal();
        renderCards();
      }

      function deleteChampion(index) {
        if (confirm(`'${matchups[index].name}' 공략을 삭제하시겠습니까?`)) {
          matchups.splice(index, 1);
          renderCards();
        }
      }

      // JSON 세이브 파일 내보내기 (다운로드)
      function exportJSON() {
        const dataStr =
          'data:text/json;charset=utf-8,' +
          encodeURIComponent(JSON.stringify(matchups, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', 'volibear_matchups.json');
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      }

      // JSON 세이브 파일 불러오기 (업로드)
      function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const parsed = JSON.parse(e.target.result);
            if (Array.isArray(parsed)) {
              matchups = parsed;
              renderCards();
              alert('공략 데이터를 성공적으로 불러왔습니다!');
            } else {
              alert('올바른 공략 파일 형식이 아닙니다.');
            }
          } catch (err) {
            alert('파일을 읽는 중 오류가 발생했습니다.');
          }
        };
        reader.readAsText(file);
        event.target.value = ''; // 초기화
      }

      // 처음 실행 시 렌더링
      renderCards();
    </script>
  </body>
</html>
